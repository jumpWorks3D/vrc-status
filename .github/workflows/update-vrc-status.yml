name: Update VRChat status

on:
  # Actions画面から手動実行できるようにする。
  workflow_dispatch:

  # 毎時3分、13分、23分、33分、43分、53分に実行する。
  schedule:
    - cron: "7 * * * *"
    - cron: "17 * * * *"
    - cron: "27 * * * *"
    - cron: "37 * * * *"
    - cron: "47 * * * *"
    - cron: "57 * * * *"

# Repository内容は読み取りのみ。
# Pagesへのデプロイに必要な権限だけを追加する。
permissions:
  contents: read
  pages: write
  id-token: write

# Pagesのデプロイが重複しないようにする。
# 実行中のデプロイは途中でキャンセルしない。
concurrency:
  group: "vrc-status-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Generate Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate status file
        run: python scripts/update-vrc-status.py

      - name: Verify generated file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public/vrc-status.txt")
          raw = path.read_bytes()

          if not raw:
              raise SystemExit(
                  "ERROR: public/vrc-status.txt is empty."
              )

          if raw.startswith(b"\xef\xbb\xbf"):
              raise SystemExit(
                  "ERROR: public/vrc-status.txt contains a UTF-8 BOM."
              )

          if b"\r" in raw:
              raise SystemExit(
                  "ERROR: public/vrc-status.txt contains CR characters."
              )

          try:
              text = raw.decode("utf-8")
          except UnicodeDecodeError as exception:
              raise SystemExit(
                  "ERROR: public/vrc-status.txt is not valid UTF-8."
              ) from exception

          if not text.endswith("\n"):
              raise SystemExit(
                  "ERROR: public/vrc-status.txt has no final newline."
              )

          lines = text.splitlines()

          expected_keys = [
              "version",
              "generated_at",
              "source_updated_at",
              "overall",
              "api_website",
              "realtime_networking",
          ]

          actual_keys = []

          for line in lines:
              if line.count("=") != 1:
                  raise SystemExit(
                      f"ERROR: Invalid output line: {line!r}"
                  )

              key, value = line.split("=", 1)

              if not key or not value:
                  raise SystemExit(
                      f"ERROR: Empty key or value: {line!r}"
                  )

              actual_keys.append(key)

          if actual_keys != expected_keys:
              raise SystemExit(
                  "ERROR: Unexpected output keys or key order: "
                  f"{actual_keys!r}"
              )

          print("Verified public/vrc-status.txt:")
          print(text, end="")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
