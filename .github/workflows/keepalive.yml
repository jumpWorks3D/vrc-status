name: Keep scheduled workflows active

on:
  workflow_dispatch:

  # Public repositories may have scheduled workflows disabled
  # after 60 days without repository activity.
  schedule:
    - cron: "47 4 1 * *"
    - cron: "47 4 21 * *"

permissions:
  contents: write

concurrency:
  group: "repository-keepalive"
  cancel-in-progress: true

jobs:
  keepalive:
    name: Refresh repository activity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update keepalive file
        shell: bash
        run: |
          set -euo pipefail

          git pull --ff-only origin main

          date -u +"%Y-%m-%d" > .github/keepalive

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive

          if git diff --cached --quiet; then
            echo "Keepalive file is already current."
            exit 0
          fi

          git commit \
            -m "chore: refresh scheduled workflow activity"

          git push origin HEAD:main
